services:
  - type: web
    name: wrw-business-system
    runtime: docker
    plan: starter
    healthCheckPath: /health/live
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: APP_TIMEZONE
        value: Africa/Harare
      - key: CURRENCY_CODE
        value: MWK
