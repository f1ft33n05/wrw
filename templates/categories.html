{% include "header.html" %}
<body>
<div class="container row">
  {% include "sidebar.html" %}
  <div class="col-xs-12 col-md-9">
<main class="container items-page">
  <header><a href="/items">Items</a><a href="/items/discounts">Discounts</a></header>
  <h1>Categories</h1>
  <form id="category-form">
    <label>Name <input name="name" required></label>
    <label>Description <input name="description"></label>
    <p id="category-error" role="alert"></p>
    <button>Add category</button>
  </form>
  <table class="striped">
    <thead><tr><th>Name</th><th>Description</th></tr></thead>
    <tbody>
      {% for category in categories %}
      <tr><td>{{ category.name }}</td><td>{{ category.description or "" }}</td></tr>
      {% else %}
      <tr><td colspan="2">No categories found.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</main>
</div>
</div>
<script src="{{ url_for('static', path='js/categories.js') }}"></script>
</body>
</html>
