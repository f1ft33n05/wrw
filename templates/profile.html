{% include "header.html" %}
<body>
  {% include "navbar.html" %}
  <div class="content-container row">
    {% include "sidebar.html" %}
    <main class="col-xs-12 col-md-9">
      <h1>My profile</h1>
      {% if request.query_params.get("updated") == "1" %}
        <p>Profile updated successfully.</p>
      {% endif %}
      <article>
        <form method="post" action="/profile">
          <label>Username<input type="text" value="{{ profile.username }}" disabled></label>
          <label>Name<input name="name" value="{{ profile.name }}" required></label>
          <label>Email<input name="email" type="email" value="{{ profile.email or '' }}" required></label>
          <label>Phone<input name="phone" type="tel" value="{{ profile.phone or '' }}" required></label>
          <fieldset>
            <legend>Change password</legend>
            <label>Current password<input name="current_password" type="password" autocomplete="current-password"></label>
            <label>New password<input name="new_password" type="password" minlength="8" maxlength="72" autocomplete="new-password"></label>
          </fieldset>
          <button type="submit">Save profile</button>
        </form>
      </article>
    </main>
  </div>
</body>
</html>
