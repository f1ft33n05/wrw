{%include "header.html" %}
<body>
    <div class="authentication-content row">
      <form action="/auth/login" method="post" class="login-form col-xs-12 col-md-5">
        {% if next_path %}
        <input type="hidden" name="next" value="{{ next_path }}">
        {% endif %}
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required autocomplete="false">

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required autocomplete="false">

        {% if error_message %}
        <p class="login-error" role="alert">
          {{ error_message }}
          {% if retry_after_seconds %}
          <strong id="login-retry-countdown" data-seconds="{{ retry_after_seconds }}"></strong>
          {% endif %}
        </p>
        {% endif %}
        <button type="submit">Log In</button>
      </form>
      <div class="spacer col-md-2"></div>
      <div class="illustration col-xs-12 col-md-5">
        <img src="{{ url_for('static', path='images/wrw-logo.png') }}" alt="We Are Wines" class="illustration-image">
      </div>
    </div>
    {%include "footer.html" %}
    {% if error_message %}
    <script>
      const countdown = document.querySelector("#login-retry-countdown");
      if (countdown) {
        let seconds = Number(countdown.dataset.seconds);
        const updateCountdown = () => {
          const minutes = Math.floor(seconds / 60);
          const remainingSeconds = seconds % 60;
          countdown.textContent = ` ${minutes}:${String(remainingSeconds).padStart(2, "0")}`;
          if (seconds > 0) {
            seconds -= 1;
            window.setTimeout(updateCountdown, 1000);
          } else {
            document.querySelector(".login-error").textContent =
              "You can try logging in again now.";
          }
        };
        updateCountdown();
      } else if (!{{ "true" if session_expired else "false" }}) {
        window.setTimeout(() => {
          document.querySelector(".login-error")?.remove();
        }, 3000);
      }
    </script>
    {% endif %}
</body>
</html>
